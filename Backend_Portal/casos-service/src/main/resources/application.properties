spring.application.name=casos-service
server.port=8081

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:db_casos}
spring.datasource.username=${DB_USER:casos_user}
spring.datasource.password=${DB_PASSWORD:8888}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MISMA CLAVE DE TOKENS QUE AUTH-SERVICE
jwt.secret=${JWT_SECRET:cambia_esto_por_una_clave_secreta_larga_y_aleatoria_de_al_menos_32_caracteres}

auth.service.url=${AUTH_URL:http://localhost:8080}
notificaciones.service.url=${NOTIFICACIONES_URL:http://localhost:8084}
bitacora.service.url=${BITACORA_URL:http://localhost:8085}
frontend.url=${FRONTEND_URL:http://localhost:4200}

# TAMAÑO MÁXIMO DE LOS ARCHIVOS QUE SE SUBEN
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=150MB
# AVISA EL ERROR DE TAMAÑO EN LUGAR DE CORTAR LA CONEXIÓN
server.tomcat.max-swallow-size=-1
# CARPETA DONDE SE GUARDAN LOS ADJUNTOS
archivos.directorio=${ARCHIVOS_DIR:./uploads}
