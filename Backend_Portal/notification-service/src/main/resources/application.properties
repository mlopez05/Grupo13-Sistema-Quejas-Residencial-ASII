# LAS CLAVES SE LEEN DEL .env DE LA RAÍZ (O DE VARIABLES DE ENTORNO); NUNCA SE ESCRIBEN AQUÍ
spring.config.import=optional:file:./.env[.properties],optional:file:../../.env[.properties]

server.port=8084

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

mail.remitente.nombre=Portal Residencial

# PROVEEDOR DE CORREO: smtp (LOCAL) O brevo (NUBE)
correo.proveedor=${CORREO_PROVEEDOR:smtp}
correo.remitente=${CORREO_REMITENTE:${MAIL_USERNAME:}}

# BREVO (API HTTPS)
brevo.url=https://api.brevo.com/v3/smtp/email
brevo.api-key=${BREVO_API_KEY:}

# ALERTAS INTERNAS DEL PORTAL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:db_notificaciones}
spring.datasource.username=${DB_USER:notificaciones_user}
spring.datasource.password=${DB_NOTIFICACIONES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MISMA CLAVE DE TOKENS QUE AUTH-SERVICE
jwt.secret=${JWT_SECRET}
frontend.url=${FRONTEND_URL:http://localhost:4200}