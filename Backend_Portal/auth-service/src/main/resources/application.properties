# LAS CLAVES SE LEEN DEL .env DE LA RAÍZ (O DE VARIABLES DE ENTORNO); NUNCA SE ESCRIBEN AQUÍ
spring.config.import=optional:file:./.env[.properties],optional:file:../../.env[.properties]

spring.application.name=auth-service
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:db-auth}
spring.datasource.username=${DB_USER:auth_user}
spring.datasource.password=${DB_AUTH_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

notificaciones.service.url=${NOTIFICACIONES_URL:http://localhost:8084}
frontend.reset-password.url=${FRONTEND_RESET_URL:http://localhost:4200/restablecer-password}
frontend.login.url=${FRONTEND_LOGIN_URL:http://localhost:4200/login}
bitacora.service.url=${BITACORA_URL:http://localhost:8085}

casos.service.url=${CASOS_URL:http://localhost:8081}

# IP REAL DEL USUARIO CUANDO LA PETICIÓN LLEGA POR NGINX
server.forward-headers-strategy=native

# PRIMER ADMINISTRADOR DE UNA INSTALACIÓN NUEVA (SOLO SE USA SI NO EXISTE NINGUNO)
admin.inicial.correo=${ADMIN_CORREO:}
admin.inicial.clave=${ADMIN_CLAVE:}
