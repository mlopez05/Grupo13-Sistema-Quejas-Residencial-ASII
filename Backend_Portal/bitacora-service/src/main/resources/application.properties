# LAS CLAVES SE LEEN DEL .env DE LA RAÍZ (O DE VARIABLES DE ENTORNO); NUNCA SE ESCRIBEN AQUÍ
spring.config.import=optional:file:./.env[.properties],optional:file:../../.env[.properties]

spring.application.name=bitacora-service
server.port=8085
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:db_bitacora}
spring.datasource.username=${DB_USER:bitacora_user}
spring.datasource.password=${DB_BITACORA_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MISMA CLAVE DE TOKENS QUE AUTH-SERVICE
jwt.secret=${JWT_SECRET}
frontend.url=${FRONTEND_URL:http://localhost:4200}
