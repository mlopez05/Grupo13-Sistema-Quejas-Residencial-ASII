spring.application.name=bitacora-service
server.port=8085
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:db_bitacora}
spring.datasource.username=${DB_USER:bitacora_user}
spring.datasource.password=${DB_PASSWORD:8888}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MISMA CLAVE DE TOKENS QUE AUTH-SERVICE
jwt.secret=${JWT_SECRET:cambia_esto_por_una_clave_secreta_larga_y_aleatoria_de_al_menos_32_caracteres}
frontend.url=${FRONTEND_URL:http://localhost:4200}
