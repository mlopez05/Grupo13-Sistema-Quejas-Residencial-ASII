 <div class="min-h-screen bg-slate-50 px-4 py-12 flex items-center justify-center">
  <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">

    <div class="mb-6 flex h-14 w-14 items-center justify-center rounded-2xl bg-blue-100 text-blue-600">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-7 w-7">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 8.25 12 14l9-5.75M4.5 5.25h15A1.5 1.5 0 0 1 21 6.75v10.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.25V6.75a1.5 1.5 0 0 1 1.5-1.5Z" />
      </svg>
    </div>

    <h1 class="mb-2 text-2xl font-bold text-slate-900">
      Recuperar contraseña
    </h1>

    <p class="mb-8 text-sm leading-6 text-slate-600">
      Ingresa el correo electrónico asociado a tu cuenta. Te indicaremos cómo continuar con la recuperación.
    </p>

    <form>
      <div class="mb-6">
        <label for="email" class="mb-2 block text-sm font-medium text-slate-700">
          Correo electrónico
        </label>

        <input
          id="email"
          type="email"
          placeholder="nombre@ejemplo.com"
          class="block w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10"
        />
      </div>

      <button
        type="submit"
        class="w-full rounded-xl bg-blue-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-blue-700"
      >
        Recuperar contraseña
      </button>
    </form>

    <div class="mt-6 text-center">
      <a routerLink="/login" class="text-sm font-medium text-blue-600 transition hover:text-blue-700 hover:underline">
        Volver al inicio de sesión
      </a>
    </div>

  </div>
</div>
