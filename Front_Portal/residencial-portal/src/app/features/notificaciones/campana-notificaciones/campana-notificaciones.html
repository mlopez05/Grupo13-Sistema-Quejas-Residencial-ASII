<div class="relative">

  <button
    type="button"
    (click)="alternar()"
    class="relative flex h-10 w-10 items-center justify-center rounded-xl text-slate-500 transition hover:bg-slate-100 hover:text-slate-700"
    [attr.aria-label]="'Notificaciones' + (notificaciones.totalNoLeidas() ? ', ' + notificaciones.totalNoLeidas() + ' sin leer' : '')"
    [attr.aria-expanded]="abierta()">

    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"
      class="h-5 w-5">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M14.857 17.082a23.848 23.848 0 0 1-5.714 0A2.25 2.25 0 0 1 7.5 14.86V11.25a4.5 4.5 0 0 1 9 0v3.61a2.25 2.25 0 0 1-1.643 2.222ZM9.75 20.25h4.5" />
    </svg>

    @if (notificaciones.totalNoLeidas() > 0) {
    <span
      class="absolute -right-0.5 -top-0.5 flex h-5 min-w-5 items-center justify-center rounded-full bg-red-500 px-1 text-[10px] font-bold text-white">
      {{ notificaciones.totalNoLeidas() > 99 ? '99+' : notificaciones.totalNoLeidas() }}
    </span>
    }

  </button>


  @if (abierta()) {
  <div class="absolute right-0 z-50 mt-2 w-96 max-w-[calc(100vw-2rem)] overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-xl">

    <div class="flex items-center justify-between border-b border-slate-100 px-4 py-3">
      <p class="text-sm font-semibold text-slate-900">
        Notificaciones
      </p>

      @if (notificaciones.totalNoLeidas() > 0) {
      <button type="button" (click)="marcarTodas()"
        class="text-xs font-semibold text-blue-600 transition hover:text-blue-700">
        Marcar todas como leídas
      </button>
      }
    </div>

    <ul class="max-h-96 divide-y divide-slate-100 overflow-y-auto">

      @for (notificacion of notificaciones.recientes(); track notificacion.id) {
      <li>
        <button type="button" (click)="abrir(notificacion)"
          [class]="'flex w-full gap-3 px-4 py-3 text-left transition hover:bg-slate-50 ' + (notificacion.leida ? '' : 'bg-blue-50/60')">

          <span [class]="'mt-1.5 h-2 w-2 shrink-0 rounded-full ' + (notificacion.leida ? 'bg-transparent' : 'bg-blue-600')"></span>

          <span class="min-w-0 flex-1">
            <span [class]="'block text-sm ' + (notificacion.leida ? 'text-slate-700' : 'font-semibold text-slate-900')">
              {{ notificacion.titulo }}
            </span>
            <span class="mt-0.5 block text-xs text-slate-500">
              {{ notificacion.mensaje }}
            </span>
            <span class="mt-1 block text-xs text-slate-400">
              {{ notificacion.fecha | date: 'dd/MM/yyyy HH:mm' }}
            </span>
          </span>

        </button>
      </li>
      } @empty {
      <li class="px-4 py-10 text-center text-sm text-slate-500">
        No tienes notificaciones.
      </li>
      }

    </ul>

  </div>
  }

</div>
