# SIRVE EL FRONT Y REENVÍA CADA RUTA DE LA API A SU MICROSERVICIO
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ADJUNTOS: HASTA 150 MB POR PETICIÓN
    client_max_body_size 160m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # AUTH-SERVICE
    location /api/auth/ {
        proxy_pass http://auth-service:8080;
    }

    location /api/registro/ {
        proxy_pass http://auth-service:8080;
    }

    # CASOS-SERVICE (INCLUYE CATÁLOGO, ADJUNTOS Y REPORTES)
    location /api/casos {
        proxy_pass http://casos-service:8081;
    }

    # CONTENIDO-SERVICE
    location /api/portal/ {
        proxy_pass http://contenido-service:8082;
    }

    # NOTIFICATION-SERVICE: EL POST ES INTERNO, DESDE AFUERA SOLO SE CONSULTA
    location = /notificaciones {
        limit_except GET {
            deny all;
        }
        proxy_pass http://notification-service:8084;
    }

    location /notificaciones/ {
        proxy_pass http://notification-service:8084;
    }

    # ALERTAS EN TIEMPO REAL (WEBSOCKET)
    location /ws {
        proxy_pass http://notification-service:8084;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # BITACORA-SERVICE: SOLO LOS REPORTES; EL REGISTRO DE EVENTOS ES INTERNO
    location /bitacora/reportes/ {
        proxy_pass http://bitacora-service:8085;
    }

    location /bitacora/ {
        return 404;
    }

    # RUTAS DEL FRONT (ANGULAR)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
